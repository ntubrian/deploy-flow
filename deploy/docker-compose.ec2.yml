services:
  api:
    image: ${API_IMAGE}
    environment:
      NODE_ENV: production
      APP_PORT: "3000"
      APP_STAGE: ${APP_STAGE:-staging}
      AWS_REGION: ${AWS_REGION}
      AWS_DEFAULT_REGION: ${AWS_REGION}
      AWS_SSM_PARAMETER_PREFIX: ${AWS_SSM_PARAMETER_PREFIX:-/deploy-flow}
      DB_SSL_ROOT_CERT_PATH: ${DB_SSL_ROOT_CERT_PATH:-}
    volumes:
      - ./certs/rds:/run/certs/rds:ro
    logging:
      driver: awslogs
      options:
        awslogs-create-group: "true"
        awslogs-group: ${CLOUDWATCH_LOG_GROUP_API:-/deploy-flow/staging/api}
        awslogs-region: ${AWS_REGION}
        awslogs-stream: api
    restart: unless-stopped

  client:
    image: ${CLIENT_IMAGE}
    environment:
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      - api
    logging:
      driver: awslogs
      options:
        awslogs-create-group: "true"
        awslogs-group: ${CLOUDWATCH_LOG_GROUP_CLIENT:-/deploy-flow/staging/client}
        awslogs-region: ${AWS_REGION}
        awslogs-stream: client
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_TLS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/origin.crt:/etc/nginx/certs/origin.crt:ro
      - ./certs/origin.key:/etc/nginx/certs/origin.key:ro
    depends_on:
      - client
      - api
    logging:
      driver: awslogs
      options:
        awslogs-create-group: "true"
        awslogs-group: ${CLOUDWATCH_LOG_GROUP_NGINX:-/deploy-flow/staging/nginx}
        awslogs-region: ${AWS_REGION}
        awslogs-stream: nginx
    restart: unless-stopped
