services:
  api:
    image: ${API_IMAGE}
    environment:
      NODE_ENV: production
      APP_PORT: "3000"
      APP_STAGE: ${APP_STAGE:-staging}
      AWS_REGION: ${AWS_REGION}
      AWS_SSM_PARAMETER_PREFIX: ${AWS_SSM_PARAMETER_PREFIX:-/deploy-flow}
      DB_SSL_ROOT_CERT_PATH: ${DB_SSL_ROOT_CERT_PATH:-}
    restart: unless-stopped

  client:
    image: ${CLIENT_IMAGE}
    environment:
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      - api
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_TLS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/origin.crt:/etc/nginx/certs/origin.crt:ro
      - ./certs/origin.key:/etc/nginx/certs/origin.key:ro
    depends_on:
      - client
      - api
    restart: unless-stopped
