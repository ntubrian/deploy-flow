services:
  api:
    image: ${API_IMAGE}
    environment:
      NODE_ENV: production
      PORT: "3000"
    restart: unless-stopped

  client:
    image: ${CLIENT_IMAGE}
    environment:
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      - api
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
      - api
    restart: unless-stopped
