name: Staging Deploy

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_API_REPOSITORY: ${{ vars.ECR_API_REPOSITORY }}
      ECR_CLIENT_REPOSITORY: ${{ vars.ECR_CLIENT_REPOSITORY }}
      STAGING_INSTANCE_ID: ${{ vars.STAGING_INSTANCE_ID }}
      STAGING_APP_DIR: ${{ vars.STAGING_APP_DIR }}
      STAGING_NGINX_PORT: ${{ vars.STAGING_NGINX_PORT || '80' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate staging config
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AWS_REGION}"
          test -n "${ECR_API_REPOSITORY}"
          test -n "${ECR_CLIENT_REPOSITORY}"
          test -n "${STAGING_INSTANCE_ID}"
          test -n "${STAGING_APP_DIR}"

      - name: Create staging tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          latest_raw=$(git tag -l 'stg-v[0-9]*.[0-9]*.[0-9]*' | sed 's/^stg-v//' | sort -V | tail -n1)
          if [ -z "${latest_raw}" ]; then
            latest_raw="0.0.0"
          fi

          IFS='.' read -r major minor patch <<< "$latest_raw"
          next_patch=$((patch + 1))
          tag="stg-v${major}.${minor}.${next_patch}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"

          echo "value=$tag" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_API_REPOSITORY }}:${{ steps.tag.outputs.value }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_API_REPOSITORY }}:sha-${{ github.sha }}

      - name: Build and push Client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.client
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_CLIENT_REPOSITORY }}:${{ steps.tag.outputs.value }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_CLIENT_REPOSITORY }}:sha-${{ github.sha }}

      - name: Deploy to staging EC2 (SSM)
        shell: bash
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          API_TAGGED_IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_API_REPOSITORY }}:${{ steps.tag.outputs.value }}
          CLIENT_TAGGED_IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_CLIENT_REPOSITORY }}:${{ steps.tag.outputs.value }}
          AWS_REGION: ${{ env.AWS_REGION }}
          INSTANCE_ID: ${{ env.STAGING_INSTANCE_ID }}
          APP_DIR: ${{ env.STAGING_APP_DIR }}
          NGINX_PORT: ${{ env.STAGING_NGINX_PORT }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          aws --version

          cat > /tmp/ssm-params.json <<EOF
          {
            "commands": [
              "set -euo pipefail",
              "cd ${APP_DIR}",
              "sudo -u ec2-user git fetch origin --tags",
              "sudo -u ec2-user git checkout staging",
              "sudo -u ec2-user git pull --ff-only origin staging",
              "aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${REGISTRY}",
              "export API_IMAGE=${API_TAGGED_IMAGE}",
              "export CLIENT_IMAGE=${CLIENT_TAGGED_IMAGE}",
              "export NGINX_PORT=${NGINX_PORT}",
              "docker compose -f deploy/docker-compose.ec2.yml pull",
              "docker compose -f deploy/docker-compose.ec2.yml up -d --remove-orphans",
              "docker image prune -f"
            ]
          }
          EOF

          command_id="$(
            aws ssm send-command \
              --region "$AWS_REGION" \
              --document-name "AWS-RunShellScript" \
              --instance-ids "$INSTANCE_ID" \
              --comment "deploy-flow staging ${TAG}" \
              --parameters file:///tmp/ssm-params.json \
              --query "Command.CommandId" \
              --output text
          )"

          echo "SSM CommandId=$command_id"
          aws ssm wait command-executed --region "$AWS_REGION" --command-id "$command_id" --instance-id "$INSTANCE_ID"

          status="$(
            aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text
          )"
          echo "SSM Status=$status"

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" \
            --output text >&2 || true

          test "$status" = "Success"
