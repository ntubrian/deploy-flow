name: Staging Deploy

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_API_REPOSITORY: ${{ vars.ECR_API_REPOSITORY }}
      ECR_CLIENT_REPOSITORY: ${{ vars.ECR_CLIENT_REPOSITORY }}
      AWS_SSM_PARAMETER_PREFIX: ${{ vars.AWS_SSM_PARAMETER_PREFIX || '/deploy-flow' }}
      STAGING_DB_SSL_ROOT_CERT_PATH: ${{ vars.STAGING_DB_SSL_ROOT_CERT_PATH || '' }}
      STAGING_INSTANCE_ID: ${{ vars.STAGING_INSTANCE_ID }}
      STAGING_APP_DIR: ${{ vars.STAGING_APP_DIR }}
      STAGING_NGINX_PORT: ${{ vars.STAGING_NGINX_PORT || '80' }}
      WEB_GATE_BASIC_USERNAME: ${{ vars.WEB_GATE_BASIC_USERNAME || 'deploy-flow' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate staging config
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AWS_REGION}"
          test -n "${ECR_API_REPOSITORY}"
          test -n "${ECR_CLIENT_REPOSITORY}"
          test -n "${STAGING_INSTANCE_ID}"
          test -n "${STAGING_APP_DIR}"

      - name: Create staging tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          latest_raw=$(git tag -l 'stg-v[0-9]*.[0-9]*.[0-9]*' | sed 's/^stg-v//' | sort -V | tail -n1)
          if [ -z "${latest_raw}" ]; then
            latest_raw="0.0.0"
          fi

          IFS='.' read -r major minor patch <<< "$latest_raw"
          next_patch=$((patch + 1))
          tag="stg-v${major}.${minor}.${next_patch}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"

          echo "value=$tag" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_API_REPOSITORY }}:${{ steps.tag.outputs.value }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_API_REPOSITORY }}:sha-${{ github.sha }}

      - name: Build and push Client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.client
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_CLIENT_REPOSITORY }}:${{ steps.tag.outputs.value }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_CLIENT_REPOSITORY }}:sha-${{ github.sha }}

      - name: Deploy to staging EC2 (SSM)
        shell: bash
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          API_TAGGED_IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_API_REPOSITORY }}:${{ steps.tag.outputs.value }}
          CLIENT_TAGGED_IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_CLIENT_REPOSITORY }}:${{ steps.tag.outputs.value }}
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_SSM_PARAMETER_PREFIX: ${{ env.AWS_SSM_PARAMETER_PREFIX }}
          STAGING_DB_SSL_ROOT_CERT_PATH: ${{ env.STAGING_DB_SSL_ROOT_CERT_PATH }}
          WEB_GATE_BASIC_USERNAME: ${{ env.WEB_GATE_BASIC_USERNAME }}
          INSTANCE_ID: ${{ env.STAGING_INSTANCE_ID }}
          APP_DIR: ${{ env.STAGING_APP_DIR }}
          NGINX_PORT: ${{ env.STAGING_NGINX_PORT }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          aws --version

          cat > /tmp/ssm-params.json <<EOF
          {
            "commands": [
              "set -euo pipefail",
              "cd ${APP_DIR}",
              "sudo -u ec2-user git fetch origin --tags",
              "sudo -u ec2-user git checkout staging",
              "sudo -u ec2-user git pull --ff-only origin staging",
              "if ! command -v node >/dev/null 2>&1; then echo 'Node.js is required on the staging host to run migrations' >&2; exit 1; fi",
              "if ! command -v corepack >/dev/null 2>&1; then echo 'corepack not found; installing corepack via npm --force' >&2; npm install -g corepack --force; fi",
              "if ! command -v corepack >/dev/null 2>&1; then echo 'corepack still not found, attempting fallback by symlink pnpm path to corepack' >&2; \
               if command -v pnpm >/dev/null 2>&1; then mkdir -p /usr/local/bin && ln -sf $(command -v pnpm) /usr/local/bin/corepack; fi; fi",
              "if ! command -v corepack >/dev/null 2>&1; then echo 'corepack is required on the staging host to manage pnpm' >&2; exit 1; fi",
              "node -e \"const [major, minor] = process.versions.node.split('.').map(Number); if (major < 20 || (major === 20 && minor < 19)) { console.error('Node.js >= 20.19.0 is required on the staging host'); process.exit(1); }\"",
              "if ! command -v openssl >/dev/null 2>&1; then echo 'openssl is required on the staging host to generate nginx basic auth credentials' >&2; exit 1; fi",
              "corepack enable",
              "migration_db_ssl_root_cert_path=''",
              "if [ -n \"${STAGING_DB_SSL_ROOT_CERT_PATH}\" ]; then migration_db_ssl_root_cert_path=\"${APP_DIR}/deploy/certs/rds/\$(basename \"${STAGING_DB_SSL_ROOT_CERT_PATH}\")\"; test -f \"\$migration_db_ssl_root_cert_path\"; fi",
              "export APP_STAGE=staging",
              "export AWS_REGION=${AWS_REGION}",
              "export AWS_DEFAULT_REGION=${AWS_REGION}",
              "export AWS_SSM_PARAMETER_PREFIX=${AWS_SSM_PARAMETER_PREFIX}",
              "export DB_SSL_ROOT_CERT_PATH=\"\$migration_db_ssl_root_cert_path\"",
              "export WEB_GATE_BASIC_USERNAME=${WEB_GATE_BASIC_USERNAME}",
              "web_gate_shared_secret=\$(aws ssm get-parameter --region ${AWS_REGION} --name \"${AWS_SSM_PARAMETER_PREFIX}/staging/api/web-gate/shared-secret\" --with-decryption --query 'Parameter.Value' --output text)",
              "install -d -m 755 \"${APP_DIR}/deploy/auth\"",
              "printf '%s:%s\n' \"${WEB_GATE_BASIC_USERNAME}\" \"\$(openssl passwd -apr1 \"\$web_gate_shared_secret\")\" > \"${APP_DIR}/deploy/auth/basic.htpasswd\"",
              "sudo chown -R ec2-user:ec2-user \"${APP_DIR}\"",
              "sudo --preserve-env=APP_STAGE,AWS_REGION,AWS_DEFAULT_REGION,AWS_SSM_PARAMETER_PREFIX,DB_SSL_ROOT_CERT_PATH,WEB_GATE_BASIC_USERNAME -u ec2-user bash -lc 'cd \"${APP_DIR}\" && pnpm install --frozen-lockfile && pnpm nx run @deploy-flow/api:db-migration-show && pnpm nx run @deploy-flow/api:db-migration-run && pnpm nx run @deploy-flow/api:db-migration-show'",
              "aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${REGISTRY}",
              "export API_IMAGE=${API_TAGGED_IMAGE}",
              "export CLIENT_IMAGE=${CLIENT_TAGGED_IMAGE}",
              "export NGINX_PORT=${NGINX_PORT}",
              "export DB_SSL_ROOT_CERT_PATH=${STAGING_DB_SSL_ROOT_CERT_PATH}",
              "export WEB_GATE_BASIC_USERNAME=${WEB_GATE_BASIC_USERNAME}",
              "if docker compose version >/dev/null 2>&1; then COMPOSE='docker compose'; elif command -v docker-compose >/dev/null 2>&1; then COMPOSE='docker-compose'; else mkdir -p ~/.docker/cli-plugins; if uname -m | grep -Eq '^(aarch64|arm64)$'; then curl -fsSL 'https://github.com/docker/compose/releases/download/v2.33.1/docker-compose-linux-aarch64' -o ~/.docker/cli-plugins/docker-compose; elif uname -m | grep -Eq '^x86_64$'; then curl -fsSL 'https://github.com/docker/compose/releases/download/v2.33.1/docker-compose-linux-x86_64' -o ~/.docker/cli-plugins/docker-compose; else echo 'Unsupported arch' >&2; uname -m >&2; exit 1; fi; chmod +x ~/.docker/cli-plugins/docker-compose; docker compose version >/dev/null 2>&1 || { echo 'Docker Compose install failed' >&2; exit 1; }; COMPOSE='docker compose'; fi",
              "\${COMPOSE} -f deploy/docker-compose.ec2.yml pull",
              "\${COMPOSE} -f deploy/docker-compose.ec2.yml up -d --remove-orphans",
              "api_container_id=\$(\${COMPOSE} -f deploy/docker-compose.ec2.yml ps -q api)",
              "test -n \"\$api_container_id\"",
              "api_status=\$(docker inspect --format '{{.State.Status}}' \"\$api_container_id\")",
              "if [ \"\$api_status\" != 'running' ]; then \${COMPOSE} -f deploy/docker-compose.ec2.yml logs api --tail 200 >&2; exit 1; fi",
              "docker image prune -f"
            ]
          }
          EOF

          command_id="$(
            aws ssm send-command \
              --region "$AWS_REGION" \
              --document-name "AWS-RunShellScript" \
              --instance-ids "$INSTANCE_ID" \
              --comment "deploy-flow staging ${TAG}" \
              --parameters file:///tmp/ssm-params.json \
              --query "Command.CommandId" \
              --output text
          )"

          echo "SSM CommandId=$command_id"
          status="Pending"
          for _ in $(seq 1 120); do
            status_raw="$(
              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --query "Status" \
                --output text 2>/dev/null || true
            )"
            status="${status_raw:-Pending}"
            case "$status" in
              Success|Failed|Cancelled|TimedOut|Undeliverable|Terminated|DeliveryTimedOut)
                break
                ;;
            esac
            sleep 2
          done

          echo "SSM Status=$status"

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" \
            --output text >&2 || true

          test "$status" = "Success"
