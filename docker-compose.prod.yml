services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      NODE_ENV: production
      APP_PORT: "3000"
      APP_STAGE: ${APP_STAGE:-production}
      AWS_REGION: ${AWS_REGION}
      AWS_SSM_PARAMETER_PREFIX: ${AWS_SSM_PARAMETER_PREFIX:-/deploy-flow}
      DB_SSL_ROOT_CERT_PATH: ${DB_SSL_ROOT_CERT_PATH:-}
      WEB_GATE_BASIC_USERNAME: ${WEB_GATE_BASIC_USERNAME:-deploy-flow}
    volumes:
      - ./deploy/certs/rds:/run/certs/rds:ro
    logging:
      driver: awslogs
      options:
        awslogs-create-group: "true"
        awslogs-group: ${CLOUDWATCH_LOG_GROUP_API:-/deploy-flow/production/api}
        awslogs-region: ${AWS_REGION}
        awslogs-stream: api
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    environment:
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      - api
    logging:
      driver: awslogs
      options:
        awslogs-create-group: "true"
        awslogs-group: ${CLOUDWATCH_LOG_GROUP_CLIENT:-/deploy-flow/production/client}
        awslogs-region: ${AWS_REGION}
        awslogs-stream: client
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/auth:/etc/nginx/auth:ro
    depends_on:
      - client
      - api
    logging:
      driver: awslogs
      options:
        awslogs-create-group: "true"
        awslogs-group: ${CLOUDWATCH_LOG_GROUP_NGINX:-/deploy-flow/production/nginx}
        awslogs-region: ${AWS_REGION}
        awslogs-stream: nginx
    restart: unless-stopped
