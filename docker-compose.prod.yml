services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      NODE_ENV: production
      APP_PORT: "3000"
      APP_STAGE: ${APP_STAGE:-production}
      AWS_REGION: ${AWS_REGION}
      AWS_SSM_PARAMETER_PREFIX: ${AWS_SSM_PARAMETER_PREFIX:-/deploy-flow}
      DB_SSL_ROOT_CERT_PATH: ${DB_SSL_ROOT_CERT_PATH:-}
    volumes:
      - ./deploy/certs/rds:/run/certs/rds:ro
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    environment:
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      - api
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
      - api
    restart: unless-stopped
