services:
  postgres:
    image: postgres:16-alpine
    container_name: deploy-flow-postgres-dev
    environment:
      POSTGRES_DB: deploy_flow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - deploy-flow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d deploy_flow']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  deploy-flow-postgres-data:
